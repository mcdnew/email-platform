services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-email_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-email_platform}
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-email_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-email_platform}"
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    ports:
      - "8501:8501"
    env_file:
      - ./frontend/.env
    environment:
      API_URL: "http://backend:8000"

volumes:
  db_data:


## usage:
# docker compose down
# docker compose build
# docker compose up -d
