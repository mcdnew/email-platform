services:
  proxy:
    image: caddy:2
    restart: always
    profiles:
      - proxy
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-email_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-email_platform}
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-email_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-email_platform}"
    volumes:
      - ./logs:/app/logs
      - card_images:/app/card_images
      - voice_notes:/app/voice_notes

  worker:
    build:
      context: ../outreach-bot
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    env_file:
      - ./worker.env
    environment:
      CORE_PLATFORM_URL: "http://backend:8000"
      CORE_PLATFORM_PUBLIC_URL: ${CORE_PLATFORM_PUBLIC_URL:-}
      CORE_PLATFORM_API_KEY: ${API_KEY}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET}
      OUTREACH_DB_PATH: /data/outreach.db
      CAMPAIGNS_DIR: /data/campaigns
      FLASK_DEBUG: "0"
      FLASK_HOST: "0.0.0.0"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-local-dev-secret}
      PORT: "5000"
    volumes:
      - ./worker-data:/data
      - worker_state:/root/.config/hailing
    command: ["python", "app.py"]

  worker-runner:
    build:
      context: ../outreach-bot
      dockerfile: Dockerfile
    restart: always
    profiles:
      - runner
    depends_on:
      - backend
      - worker
    env_file:
      - ./worker.env
    environment:
      CORE_PLATFORM_URL: "http://backend:8000"
      CORE_PLATFORM_PUBLIC_URL: ${CORE_PLATFORM_PUBLIC_URL:-}
      CORE_PLATFORM_API_KEY: ${API_KEY}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET}
      OUTREACH_DB_PATH: /data/outreach.db
      CAMPAIGNS_DIR: /data/campaigns
      FLASK_DEBUG: "0"
      FLASK_HOST: "0.0.0.0"
      PORT: "5000"
    volumes:
      - ./worker-data:/data
      - worker_state:/root/.config/hailing
    command: ["python", "main.py", "run"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      API_URL: "http://backend:8000"
      NODE_ENV: "production"

volumes:
  caddy_data:
  caddy_config:
  db_data:
  card_images:
  voice_notes:
  worker_state:


## usage:
# docker compose down
# docker compose build
# docker compose up -d
